<app-onboarding-layout [step]="1">
  <section class="step-screen step-fade" data-right-step="1" aria-label="Your profile">
    <form id="formStep1" #formEl [formGroup]="form" (ngSubmit)="submit(formEl)" novalidate class="desktop-compact-panel card-glass rounded-[23px] px-5 py-5 sm:px-6 sm:py-6" autocomplete="on">
      <div class="space-y-4">
        <div>
          <label for="fullName" class="mb-1.5 block text-[13px] font-bold text-[#344c6a]">Full name <span class="text-[#a96877]">*</span></label>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3.5 top-1/2 h-[19px] w-[19px] -translate-y-1/2 fill-none stroke-[#93a8bf] stroke-[1.7]" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2.5a7 7 0 0 1 14 0V20" stroke-linecap="round"/></svg>
            <input id="fullName" formControlName="fullName" type="text" autocomplete="name" placeholder="Your full name" required minlength="2" maxlength="90" class="input-surface h-[46px] w-full rounded-[12px] pl-11 pr-4 text-[14px] font-medium" />
          </div>
        </div>
        <div>
          <label for="timezone" class="mb-1.5 block text-[13px] font-bold text-[#344c6a]">Workspace timezone <span class="text-[#a96877]">*</span></label>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3.5 top-1/2 h-[19px] w-[19px] -translate-y-1/2 fill-none stroke-[#93a8bf] stroke-[1.7]" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <select id="timezone" formControlName="timeZoneId" required class="input-surface h-[46px] w-full appearance-none rounded-[12px] pl-11 pr-10 text-[14px] font-medium">
              @for (z of zones; track z) { <option [value]="z">{{ zoneLabel(z) }}</option> }
            </select>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-[#91a5bb] stroke-2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
      <app-problem-banner [problem]="problem()" />
      <button type="submit" [disabled]="busy()" class="soft-btn mt-5 inline-flex h-[46px] w-full items-center justify-center gap-2 rounded-[14px] bg-[#183354] px-5 text-[14px] font-bold text-white shadow-[0_9px_23px_rgba(24,51,84,.14)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#799bbc]">{{ busy() ? 'Saving…' : 'Next' }} <svg viewBox="0 0 24 24" class="h-[17px] w-[17px] fill-none stroke-current stroke-2" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </section>
</app-onboarding-layout>
