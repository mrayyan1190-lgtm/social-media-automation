<app-onboarding-layout [step]="2">
  <section class="step-screen step-fade" data-right-step="2" aria-label="Your brand">
    <form id="formStep2" #formEl [formGroup]="form" (ngSubmit)="submit(formEl)" novalidate class="desktop-compact-panel card-glass rounded-[23px] px-5 py-5 sm:px-6 sm:py-6">
      <div class="space-y-3">
        <div>
          <label for="businessDescription" class="mb-1.5 block text-[13px] font-bold text-[#344c6a]">Business description <span class="text-[#a96877]">*</span></label>
          <textarea id="businessDescription" formControlName="businessDescription" rows="2" minlength="3" maxlength="600" required placeholder="What does your business do?" class="input-surface min-h-[58px] w-full resize-y rounded-[12px] px-3.5 py-2 text-[14px] font-medium leading-5"></textarea>
        </div>
        <div>
          <label for="targetAudience" class="mb-1.5 block text-[13px] font-bold text-[#344c6a]">Target audience <span class="text-[#a96877]">*</span></label>
          <textarea id="targetAudience" formControlName="targetAudience" rows="2" minlength="3" maxlength="500" required placeholder="Who do you want to reach?" class="input-surface min-h-[58px] w-full resize-y rounded-[12px] px-3.5 py-2 text-[14px] font-medium leading-5"></textarea>
        </div>
        <div>
          <label for="brandTone" class="mb-1.5 block text-[13px] font-bold text-[#344c6a]">Brand tone <span class="text-[#a96877]">*</span></label>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3.5 top-1/2 h-[18px] w-[18px] -translate-y-1/2 fill-none stroke-[#93a8bf] stroke-[1.7]" aria-hidden="true"><path d="m12 2 2.9 6.1 6.7.9-4.8 4.8 1.2 6.8-6-3.2-6 3.2 1.2-6.8L2.4 9l6.7-.9L12 2Z" stroke-linejoin="round"/></svg>
            <select id="brandTone" formControlName="brandTone" required class="input-surface h-[46px] w-full appearance-none rounded-[12px] pl-11 pr-10 text-[14px] font-medium">
              @for (t of tones; track t) { <option [value]="t">{{ t }}</option> }
            </select>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-[#91a5bb] stroke-2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div>
          <label for="website" class="mb-1.5 flex items-center gap-2 text-[13px] font-bold text-[#344c6a]">Website <span class="rounded-md bg-white/75 px-2 py-0.5 text-[10px] font-semibold text-[#8195ad]">Optional</span></label>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3.5 top-1/2 h-[18px] w-[18px] -translate-y-1/2 fill-none stroke-[#93a8bf] stroke-[1.8]" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.2.4l2.2-2.2a5 5 0 0 0-7.1-7.1l-2.1 2.1M14 10a5 5 0 0 0-7.2-.4l-2.2 2.2a5 5 0 0 0 7.1 7.1l2.1-2.1" stroke-linecap="round"/></svg>
            <input id="website" formControlName="website" (input)="$any($event.target).setCustomValidity('')" type="url" inputmode="url" autocomplete="url" placeholder="https://yourwebsite.com" class="input-surface h-[46px] w-full rounded-[12px] pl-11 pr-4 text-[14px] font-medium" />
          </div>
        </div>
      </div>
      <app-problem-banner [problem]="problem()" />
      <div class="mt-4 flex items-center gap-2.5">
        <button type="button" [routerLink]="backRoute" class="inline-flex h-[46px] shrink-0 items-center gap-1.5 rounded-[13px] border border-[#d6e1ed] bg-white/70 px-5 text-[13px] font-bold text-[#657b95] transition hover:bg-white" data-back="1"><svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current stroke-2" aria-hidden="true"><path d="M20 12H4m6 6-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</button>
        <button type="submit" [disabled]="busy()" class="soft-btn inline-flex h-[46px] flex-1 items-center justify-center gap-2 rounded-[13px] bg-[#183354] px-4 text-[14px] font-bold text-white shadow-[0_9px_23px_rgba(24,51,84,.13)]">{{ busy() ? 'Saving…' : 'Continue' }} <svg viewBox="0 0 24 24" class="h-[17px] w-[17px] fill-none stroke-current stroke-2" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </form>
  </section>
</app-onboarding-layout>
